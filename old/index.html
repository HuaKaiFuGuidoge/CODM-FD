<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>战队赛分队</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>战队赛随机分队</h1>
    <textarea id="names" placeholder="每行输入一个名字..."></textarea>
    <button onclick="randomizeTeams()">随机分队</button>
    <div class="teams">
        <div id="teamRed" class="team red">游击小队</div>
        <div id="teamBlue" class="team blue">特种部队</div>
    </div>
    <script src="script.js"></script>
</body>
</html>
