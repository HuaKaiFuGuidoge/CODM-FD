<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>战队赛分队</title>
    <style>
        :root {
            --primary: #4a90e2;
            --secondary: #ff6b6b;
            --background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            background: var(--background);
            padding: 20px;
        }

        .toolbar {
            display: flex;
            gap: 15px;
            justify-content: flex-end;
            margin-bottom: 30px;
        }

        .main-container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            padding: 40px;
        }

        h1 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.2em;
            letter-spacing: 1px;
        }

        .input-section {
            margin-bottom: 30px;
        }

        textarea {
            width: 100%;
            height: 150px;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            resize: vertical;
            transition: border-color 0.3s;
        }

        textarea:focus {
            border-color: var(--primary);
            outline: none;
        }

        .btn {
            padding: 12px 25px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: #357abd;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: var(--secondary);
            color: white;
        }

        .teams-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            margin-top: 30px;
        }

        .team-card {
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }

        .team-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .max-input {
            width: 100px;
            padding: 8px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
        }

        .max-input:focus {
            border-color: var(--primary);
            outline: none;
        }

        .team-red {
            background: linear-gradient(145deg, #ffe3e3 0%, #ffcccc 100%);
            border: 2px solid #ff6b6b;
        }

        .team-blue {
            background: linear-gradient(145deg, #e3f2ff 0%, #cce5ff 100%);
            border: 2px solid #4a90e2;
        }

        .team-title {
            font-size: 1.4em;
            color: #2c3e50;
        }

        .team-members {
            line-height: 1.6;
            min-height: 100px;
        }

        @media (max-width: 768px) {
            .main-container {
                padding: 25px;
            }
            
            h1 {
                font-size: 1.8em;
            }
            
            .btn {
                width: 100%;
                justify-content: center;
            }
            
            .toolbar {
                flex-direction: column;
                gap: 10px;
            }

            .team-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }

            .max-input {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <nav class="toolbar">
        <a href="yule.html" class="btn btn-secondary">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path>
                <path d="M13 2v7h7"></path>
            </svg>
            娱乐赛
        </a>
        <a href="old/index.html" class="btn btn-secondary">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path>
                <path d="M13 2v7h7"></path>
            </svg>
            旧版
        </a>
    </nav>

    <div class="main-container">
        <h1>战队赛分队</h1>
        
        <div class="input-section">
            <textarea 
                id="names" 
                placeholder="请输入参赛人员名单，每行一个名字...
示例：
张三
李四
王五
..."
            ></textarea>
        </div>

        <button onclick="randomizeTeams()" class="btn btn-primary">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 4v6h6"></path>
                <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
            </svg>
            <span>分队</span>
        </button>

        <div class="teams-container">
            <div id="teamRed" class="team-card team-red">
                <div class="team-header">
                    <span class="team-title">🔴 红队</span>
                    <input type="number" 
                           id="redMax" 
                           class="max-input"
                           min="1" 
                           value="5"
                           placeholder="最大人数">
                </div>
                <div class="team-members">等待分组...</div>
            </div>
            
            <div id="teamBlue" class="team-card team-blue">
                <div class="team-header">
                    <span class="team-title">🔵 蓝队</span>
                    <input type="number" 
                           id="blueMax" 
                           class="max-input"
                           min="1" 
                           value="5"
                           placeholder="最大人数">
                </div>
                <div class="team-members">等待分组...</div>
            </div>
        </div>
    </div>

    <script>
        function randomizeTeams() {
            const names = document.getElementById('names').value
                .trim()
                .split('\n')
                .filter(name => name.trim());

            let redMax = parseInt(document.getElementById('redMax').value) || 5;
            let blueMax = parseInt(document.getElementById('blueMax').value) || 5;
            redMax = Math.max(1, redMax);
            blueMax = Math.max(1, blueMax);
            const totalMax = redMax + blueMax;

            if (names.length < 2) {
                alert('⚠️ 请输入至少两个有效名称！');
                return;
            }

            const shuffle = arr => {
                for (let i = arr.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [arr[i], arr[j]] = [arr[j], arr[i]];
                }
                return arr;
            };

            const shuffled = shuffle([...names]);
            const selected = shuffled.slice(0, totalMax);
            const teamRed = selected.slice(0, redMax);
            const teamBlue = selected.slice(redMax, redMax + blueMax);

            function updateTeam(teamElement, members, color) {
                const title = teamElement.querySelector('.team-title');
                const membersContainer = teamElement.querySelector('.team-members');
                
                title.innerHTML = `${color}队 (${members.length}人)`;
                membersContainer.innerHTML = members.map(name => `· ${name}`).join('<br>') || '暂无成员';
            }

            updateTeam(document.getElementById('teamRed'), teamRed, '🔴 红');
            updateTeam(document.getElementById('teamBlue'), teamBlue, '🔵 蓝');
        }
    </script>
</body>
</html>
